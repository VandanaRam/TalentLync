<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body data-page="login"><main class="auth-shell"><section class="auth-art"><div class="auth-logo"><span class="brand-mark">P</span> Pulse</div><div class="auth-visual"><div class="equalizer"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h2>Music for every<br><span>version of you.</span></h2><p>Discover local demo tracks, save your favorites, and build a listening habit that feels yours.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to Pulse</h1><p>Continue where your music left off.</p></div><form id="login-form" novalidate><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required><small class="field-error" id="login-email-error"></small></div><div class="field"><label for="login-password">Password</label><div class="password-wrap"><input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" data-target="login-password" aria-label="Show password">◉</button></div><small class="field-error" id="login-password-error"></small></div><div class="form-row"><label class="check-label"><input type="checkbox" id="remember-me"> <span>Remember me</span></label><a href="#" id="forgot-link">Forgot password?</a></div><button class="btn btn-primary full" id="login-submit" type="submit">LOGIN</button><div class="auth-status" id="login-status" role="status"></div></form><div class="divider"><span>or continue with</span></div><div class="social-row"><button type="button" class="social-btn" data-social="Google">G</button><button type="button" class="social-btn" data-social="Apple"></button><button type="button" class="social-btn" data-social="Phone">☎</button></div><p class="switch-auth">Don't have an account? <a href="register.html">Create an account</a></p></div></section></main><div id="toast-container" class="toast-container" aria-live="polite"></div><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
