<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse — Register</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body data-page="register"><main class="auth-shell"><section class="auth-art"><div class="auth-logo"><span class="brand-mark">P</span> Pulse</div><div class="auth-visual"><div class="record-stack"><div>♪</div><div>♫</div><div>♬</div></div><h2>Make your library<br><span>feel like home.</span></h2><p>Create a free demo account and keep your wishlist and listening history across refreshes.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="auth-heading"><span class="eyebrow">JOIN PULSE</span><h1>Create your account</h1><p>It only takes a minute.</p></div><form id="register-form" novalidate><div class="field"><label for="register-name">Full name</label><input id="register-name" name="name" type="text" placeholder="Vandana" autocomplete="name" required><small class="field-error" id="register-name-error"></small></div><div class="field"><label for="register-email">Email</label><input id="register-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required><small class="field-error" id="register-email-error"></small></div><div class="field"><label for="register-password">Password</label><div class="password-wrap"><input id="register-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required><button type="button" class="password-toggle" data-target="register-password" aria-label="Show password">◉</button></div><div class="strength"><div class="strength-track"><span id="strength-bar"></span></div><small id="strength-label">Password strength</small></div><small class="field-error" id="register-password-error"></small></div><div class="field"><label for="register-confirm">Confirm password</label><input id="register-confirm" name="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" required><small class="field-error" id="register-confirm-error"></small></div><label class="check-label terms"><input type="checkbox" id="terms" required> <span>I agree to the demo <a href="#">terms and conditions</a>.</span></label><button class="btn btn-primary full" id="register-submit" type="submit">CREATE ACCOUNT</button><div class="auth-status" id="register-status" role="status"></div></form><p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p></div></section></main><div id="toast-container" class="toast-container" aria-live="polite"></div><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
